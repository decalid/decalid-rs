[package]
name = "decalid-rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "decalid"
path = "src/lib.rs"

[[bin]]
name = "decalid-rs"
path = "src/main.rs"

[dependencies]
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "sqlite", "chrono"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.4", features = ["derive"]}
ical = "0.8"
anyhow = "1.0"
hyper = { version = "0.14", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
chrono-tz = "0.10.0"
rrule = "0.13.0"
iso8601-duration = { version = "0.2", features = ["chrono"] }
log = "0.4"
env_logger = "0.10"
axum = { version = "0.8.1", features = ["http2", "macros"] }
yaserde = { version = "0.12.0", features = ["derive"] }
futures = "0.3.31"
nanoid = "0.4.0"
async-backtrace = "0.2.7"
rand = "0.9.0"
tempfile = "3.8.1"
pin-project-lite = "0.2.16"
jsonwebtoken = "9.2"
tower = { version = "0.5.2", features = ["tokio", "tracing"] }
regex = "1.11.1"
pin-project = "1.1.10"

[dev-dependencies]
tempfile = "3.8.1"
tokio = { version = "1", features = ["full", "test-util"] }
